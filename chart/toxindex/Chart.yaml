apiVersion: v2
name: toxindex
version: 0.8.3
description: ToxIndex platform
type: application
kubeVersion: ">=1.29-0"
dependencies:
  - name: kiln
    version: 0.4.0
    condition: kiln.enabled
  - name: toxjobs
    version: 0.1.0
    condition: toxjobs.enabled
  - name: flow
    version: 0.1.0
    condition: flow.enabled
  - name: git
    version: 0.1.0
    condition: git.enabled
  - name: temporal
    version: 0.1.0
    condition: temporal.enabled
  - name: sage
    version: 0.1.0
    condition: sage.enabled
  - name: sysrev
    version: 0.1.0
    condition: global.sysrev.enabled
  - name: gateway
    version: 0.1.0
    condition: gateway.enabled
appVersion: 0.8.3
