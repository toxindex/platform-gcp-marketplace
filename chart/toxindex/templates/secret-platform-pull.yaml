{{- if include "toxindex.platformPullsFromLicense" . }}
{{- if not (or .Values.global.license.key .Values.global.license.remoteSecret) }}
{{- fail "global.registry is the license registry, so global.license.key or global.license.remoteSecret is required to pull the platform" }}
{{- end }}
{{- $host := include "toxindex.license.registryHost" (dict "root" .) }}
{{- if .Values.global.license.key }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "toxindex.platformPullSecret" . }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "toxindex.labels" (dict "name" (include "toxindex.platformPullSecret" .) "release" $.Release.Name "partOf" "toxindex" "component" "license") | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ dict "auths" (dict $host (dict "username" "_token" "password" .Values.global.license.key "auth" (printf "_token:%s" .Values.global.license.key | b64enc))) | toJson | b64enc }}
{{- else }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    helm.sh/resource-policy: keep
  name: {{ include "toxindex.platformPullSecret" . }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "toxindex.labels" (dict "name" (include "toxindex.platformPullSecret" .) "release" $.Release.Name "partOf" "toxindex" "component" "license") | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcpsm
  target:
    name: {{ include "toxindex.platformPullSecret" . }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: {{ printf "{\"auths\":{%q:{\"username\":\"_token\",\"password\":\"{{ .license }}\",\"auth\":\"{{ printf \"_token:%%s\" .license | b64enc }}\"}}}" $host | quote }}
  data:
    - secretKey: license
      remoteRef:
        key: {{ .Values.global.license.remoteSecret }}
{{- end }}
{{- end }}
