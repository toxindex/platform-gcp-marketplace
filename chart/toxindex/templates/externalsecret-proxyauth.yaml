{{- if .Values.global.proxyAuthRemoteSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.global.proxyAuthSecret }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "toxindex.labels" (dict "name" $.Values.global.proxyAuthSecret "release" $.Release.Name "partOf" "toxindex" "component" "identity") | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcpsm
  target:
    name: {{ .Values.global.proxyAuthSecret }}
    creationPolicy: Owner
  data:
    - secretKey: proxy-auth
      remoteRef:
        key: {{ .Values.global.proxyAuthRemoteSecret }}
{{- end }}
