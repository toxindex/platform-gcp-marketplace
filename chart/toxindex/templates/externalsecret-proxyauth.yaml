{{- if .Values.global.proxyAuthRemoteSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    helm.sh/resource-policy: keep
  name: {{ include "toxindex.proxyAuthSecretName" . }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "toxindex.labels" (dict "name" (include "toxindex.proxyAuthSecretName" $) "release" $.Release.Name "partOf" "toxindex" "component" "identity") | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcpsm
  target:
    name: {{ include "toxindex.proxyAuthSecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: proxy-auth
      remoteRef:
        key: {{ .Values.global.proxyAuthRemoteSecret }}
        version: {{ .Values.global.proxyAuthRemoteVersion | quote }}
{{- end }}
