{{- if .Values.observability.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-agent
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: otel-agent
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: agent
data:
  config.yaml: |
    receivers:
      kubeletstats:
        collection_interval: 30s
        auth_type: serviceAccount
        endpoint: https://${env:K8S_NODE_NAME}:10250
        insecure_skip_verify: true
        metric_groups: [node, pod, container, volume]
      hostmetrics:
        collection_interval: 30s
        scrapers:
          cpu: {}
          memory: {}
          disk: {}
          filesystem: {}
          load: {}
          network: {}
      filelog:
        include: [/var/log/pods/*/*/*.log]
        include_file_path: true
        operators:
          - type: container
            id: container-parser

    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      resourcedetection:
        detectors: [{{ join ", " .Values.observability.resourceDetectors }}]
        timeout: 5s
      filter/volume:
        error_mode: ignore
        metrics:
          metric:
            - 'IsMatch(name, "^k8s\\.volume\\.") and resource.attributes["k8s.volume.type"] != "persistentVolumeClaim"'
      batch:
        send_batch_size: 1024
        timeout: 5s

    exporters:
      otlp:
        endpoint: otel-collector:4317
        tls:
          insecure: true

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        metrics:
          receivers: [kubeletstats, hostmetrics]
          processors: [memory_limiter, resourcedetection, filter/volume, batch]
          exporters: [otlp]
        logs:
          receivers: [filelog]
          processors: [memory_limiter, resourcedetection, batch]
          exporters: [otlp]
{{- end }}
