{{- if and .Values.observability.enabled .Values.observability.backend.enabled }}
{{- $alerting := .Values.observability.alerting | default dict -}}
{{- $default := $alerting.webhookUrl -}}
{{- $critical := $alerting.criticalWebhookUrl | default $alerting.webhookUrl -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "toxindex.labels" (dict "name" "alertmanager" "release" $.Release.Name "partOf" "observability" "component" "alerting") | nindent 4 }}
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: default
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - matchers:
            - category="license"
          receiver: license
          repeat_interval: 24h
        - matchers:
            - severity="critical"
          receiver: critical
    receivers:
      - name: default
        {{- with $default }}
        webhook_configs:
          - url: {{ . | quote }}
            send_resolved: true
        {{- end }}
      - name: license
        {{- with $default }}
        webhook_configs:
          - url: {{ . | quote }}
            send_resolved: true
        {{- end }}
      - name: critical
        {{- with $critical }}
        webhook_configs:
          - url: {{ . | quote }}
            send_resolved: true
        {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "toxindex.labels" (dict "name" "alertmanager" "release" $.Release.Name "partOf" "observability" "component" "alerting") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels:
        {{- include "toxindex.labels" (dict "name" "alertmanager" "release" $.Release.Name "partOf" "observability" "component" "alerting") | nindent 8 }}
    spec:
      securityContext:
        {{- include "toxindex.podSecurityContext" (dict "uid" 65534) | nindent 8 }}
      containers:
        - name: alertmanager
          image: {{ include "toxindex.image" (dict "root" $ "name" "alertmanager") | quote }}
          securityContext:
            {{- include "toxindex.containerSecurityContext" (dict) | nindent 12 }}
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - containerPort: 9093
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
            - name: data
              mountPath: /alertmanager
          {{- include "toxindex.preStopDrain" . | nindent 10 }}
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9093
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: alertmanager
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "toxindex.labels" (dict "name" "alertmanager" "release" $.Release.Name "partOf" "observability" "component" "alerting") | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: 9093
{{- end }}
