{{- if and .Values.observability.enabled .Values.observability.credentialsRemoteSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.observability.credentialsSecret }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/component: collector
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcpsm
  target:
    name: {{ .Values.observability.credentialsSecret }}
    creationPolicy: Owner
  data:
    - secretKey: key.json
      remoteRef:
        key: {{ .Values.observability.credentialsRemoteSecret }}
{{- end }}
