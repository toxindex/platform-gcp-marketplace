{{- if and .Values.observability.enabled .Values.observability.credentialsRemoteSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    helm.sh/resource-policy: keep
  name: {{ .Values.observability.credentialsSecret }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "toxindex.labels" (dict "name" "otel-collector" "release" $.Release.Name "partOf" "observability" "component" "collector") | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcpsm
  target:
    name: {{ .Values.observability.credentialsSecret }}
    creationPolicy: Owner
  data:
    - secretKey: key.json
      remoteRef:
        key: {{ .Values.observability.credentialsRemoteSecret }}
{{- end }}
