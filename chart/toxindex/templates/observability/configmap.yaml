{{- if .Values.observability.enabled }}
{{- $procs := list "memory_limiter" "k8sattributes" "resourcedetection" -}}
{{- if or .Values.observability.clusterName .Values.observability.location -}}
{{- $procs = append $procs "resource" -}}
{{- end -}}
{{- $procs = append $procs "batch" -}}
{{- $isAudit := .Files.Get "files/audit-condition.txt" | trim -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "toxindex.labels" (dict "name" "otel-collector" "release" $.Release.Name "partOf" "observability" "component" "collector") | nindent 4 }}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      k8sobjects:
        auth_type: serviceAccount
        objects:
          - name: events
            mode: watch
            group: events.k8s.io
      prometheus:
        config:
          scrape_configs:
            - job_name: kube-state-metrics
              scrape_interval: 30s
              static_configs:
                - targets: [kube-state-metrics:8080]
            - job_name: flux
              scrape_interval: 30s
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names: [flux-system]
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  action: keep
                  regex: http-prom
            - job_name: external-secrets
              scrape_interval: 30s
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names: [external-secrets]
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  action: keep
                  regex: metrics
            {{- if .Values.global.gpu.runtimeClassName }}
            - job_name: dcgm-exporter
              scrape_interval: 30s
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names: [{{ .Values.global.namespace | default .Release.Namespace }}]
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                  action: keep
                  regex: dcgm-exporter
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  action: keep
                  regex: metrics
            {{- end }}
            {{- if and .Values.toxjobs.enabled .Values.toxjobs.manager.enabled }}
            - job_name: toxjobs-manager
              scrape_interval: 30s
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names: [{{ .Values.global.namespace | default .Release.Namespace }}]
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                  action: keep
                  regex: toxjobs-manager
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  action: keep
                  regex: metrics
            {{- end }}
            {{- if .Values.temporal.enabled }}
            - job_name: temporal-server
              scrape_interval: 30s
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names: [{{ .Values.global.namespace | default .Release.Namespace }}]
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                  action: keep
                  regex: temporal-server
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  action: keep
                  regex: metrics
            {{- end }}
            {{- with .Values.observability.extraScrapeConfigs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.node.name
            - k8s.deployment.name
      resourcedetection:
        detectors: [{{ join ", " .Values.observability.resourceDetectors }}]
        timeout: 5s
      {{- if or .Values.observability.clusterName .Values.observability.location }}
      resource:
        attributes:
          {{- with .Values.observability.clusterName }}
          - key: k8s.cluster.name
            value: {{ . | quote }}
            action: upsert
          {{- end }}
          {{- with .Values.observability.location }}
          - key: cloud.region
            value: {{ . | quote }}
            action: upsert
          {{- end }}
      {{- end }}
      batch:
        send_batch_size: 1024
        timeout: 5s
      filter/drop-audit:
        error_mode: propagate
        logs:
          log_record:
            - {{ $isAudit | squote }}
      filter/keep-audit:
        error_mode: propagate
        logs:
          log_record:
            - {{ printf "not (%s)" $isAudit | squote }}

    exporters:
      {{- toYaml .Values.observability.exporters | nindent 6 }}

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [{{ join ", " $procs }}]
          exporters: [{{ join ", " .Values.observability.pipelines.traces }}]
        metrics:
          receivers: [otlp, prometheus]
          processors: [{{ join ", " $procs }}]
          exporters: [{{ join ", " .Values.observability.pipelines.metrics }}]
        logs:
          receivers: [otlp, k8sobjects]
          processors: [{{ join ", " (prepend (prepend (rest $procs) "filter/drop-audit") "memory_limiter") }}]
          exporters: [{{ join ", " .Values.observability.pipelines.logs }}]
        logs/audit:
          receivers: [otlp]
          processors: [{{ join ", " (prepend (prepend (rest $procs) "filter/keep-audit") "memory_limiter") }}]
          exporters: [{{ include "toxindex.auditExporters" (dict "root" .) }}]
{{- end }}
