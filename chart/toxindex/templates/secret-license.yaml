{{- if and .Values.global.license.key .Values.global.license.remoteSecret }}
{{- fail "global.license: set either key (standalone) or remoteSecret (ESO-synced), not both" }}
{{- end }}
{{- if .Values.global.license.key }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "toxindex.license.secret" (dict "root" .) }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "toxindex.license.secret" (dict "root" .) }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: toxindex
    app.kubernetes.io/component: license
type: Opaque
stringData:
  license: {{ .Values.global.license.key | quote }}
{{- end }}
