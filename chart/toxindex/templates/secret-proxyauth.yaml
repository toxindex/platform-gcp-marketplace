{{- if not .Values.global.proxyAuthRemoteSecret }}
{{- $existing := lookup "v1" "Secret" (.Values.global.namespace | default .Release.Namespace) .Values.global.proxyAuthSecret }}
{{- $token := randAlphaNum 48 }}
{{- if $existing }}
{{- $token = index $existing.data "proxy-auth" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.proxyAuthSecret }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "toxindex.labels" (dict "name" $.Values.global.proxyAuthSecret "release" $.Release.Name "partOf" "toxindex" "component" "identity") | nindent 4 }}
type: Opaque
data:
  proxy-auth: {{ $token | b64enc | quote }}
{{- end }}
