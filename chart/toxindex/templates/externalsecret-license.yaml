{{- if .Values.global.license.remoteSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    helm.sh/resource-policy: keep
  name: {{ include "toxindex.license.secret" (dict "root" .) }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "toxindex.labels" (dict "name" (include "toxindex.license.secret" (dict "root" .)) "release" $.Release.Name "partOf" "toxindex" "component" "license") | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcpsm
  target:
    name: {{ include "toxindex.license.secret" (dict "root" .) }}
    creationPolicy: Owner
  data:
    - secretKey: license
      remoteRef:
        key: {{ .Values.global.license.remoteSecret }}
{{- end }}
