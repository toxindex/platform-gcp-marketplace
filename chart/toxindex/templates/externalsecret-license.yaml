{{- if .Values.global.license.remoteSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "toxindex.license.secret" (dict "root" .) }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "toxindex.license.secret" (dict "root" .) }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: toxindex
    app.kubernetes.io/component: license
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcpsm
  target:
    name: {{ include "toxindex.license.secret" (dict "root" .) }}
    creationPolicy: Owner
  data:
    - secretKey: license
      remoteRef:
        key: {{ .Values.global.license.remoteSecret }}
{{- end }}
