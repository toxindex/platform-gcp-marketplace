{{- if and .Values.api.enabled .Values.api.vertex.credentialsRemoteSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.api.vertex.credentialsSecret }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "sysrev.labels" (dict "name" "sysrev-api" "component" "backend" "release" $.Release.Name) | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcpsm
  target:
    name: {{ .Values.api.vertex.credentialsSecret }}
    creationPolicy: Owner
  data:
    - secretKey: key.json
      remoteRef:
        key: {{ .Values.api.vertex.credentialsRemoteSecret }}
{{- end }}
