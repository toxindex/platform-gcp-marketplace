networkPolicy:
  enabled: true

clickhouse:
  enabled: true
  loaderPasswordSecret: kiln-clickhouse-loader-password
  loaderPasswordRemoteSecret: ""
  resources:
    requests:
      cpu: 250m
      memory: 2Gi
    limits:
      memory: 6Gi
  storage:
    class: ""
    size: 20Gi
  tailscale:
    expose: false
    hostname: tidx-clickhouse

resolver:
  enabled: true

loader:
  enabled: true
  maxTables: ""

remoteClickhouse:
  enabled: false
  tailnetFqdn: ""

ssdStorage:
  enabled: false
  provisioner: rancher.io/local-path
