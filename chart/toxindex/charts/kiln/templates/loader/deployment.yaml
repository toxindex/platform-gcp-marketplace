{{- $dataset := .Values.global.datasets.kiln }}
{{- if and .Values.loader.enabled $dataset.version }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kiln-loader
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "kiln.labels" (dict "name" "kiln-loader" "component" "data-loader" "release" $.Release.Name) | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kiln.selectorLabels" (dict "name" "kiln-loader") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kiln.labels" (dict "name" "kiln-loader" "component" "data-loader" "release" $.Release.Name) | nindent 8 }}
    spec:
      restartPolicy: Always
      enableServiceLinks: false
      securityContext:
        {{- include "toxindex.podSecurityContext" (dict "uid" 101 "gid" 101) | nindent 8 }}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "kiln.selectorLabels" (dict "name" "kiln-clickhouse") | nindent 18 }}
              topologyKey: kubernetes.io/hostname
      {{- include "toxindex.platformImagePullSecrets" $ | nindent 6 }}
      containers:
        - name: loader
          image: {{ include "toxindex.image" (dict "root" $ "name" "kiln-loader") | quote }}
          securityContext:
            {{- include "toxindex.containerSecurityContext" (dict) | nindent 12 }}
          env:
            - name: CLICKHOUSE_URL
              value: {{ include "toxindex.upstream.kilnClickhouse" . | quote }}
            - name: CLICKHOUSE_DATA
              value: /var/lib/clickhouse
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clickhouse.loaderPasswordSecret }}
                  key: password
            - name: DATASET_BUCKET
              value: {{ $dataset.bucket | quote }}
            - name: DATASET_VERSION
              value: {{ $dataset.version | quote }}
            - name: GCS_TOKEN_FILE
              value: /etc/dataset/token
            - name: DATASET_UNITS_FILE
              value: /etc/dataset/units
            {{- with .Values.loader.excludeBricks }}
            - name: DATASET_EXCLUDE_BRICKS
              value: {{ join "," . | quote }}
            {{- end }}
            - name: DATASET_STORAGE_HEADROOM
              value: {{ required "kiln: loader.storageHeadroom is required" .Values.loader.storageHeadroom | quote }}
            - name: LICENSE_FILE
              value: /etc/license/license
            - name: LICENSE_BROKER_URL
              value: {{ .Values.global.license.brokerUrl | quote }}
            {{- if .Values.fts.enabled }}
            - name: KILN_FTS_BUILDER_URL
              value: http://kiln-fts-builder
            {{- end }}
            {{- with .Values.loader.maxTables }}
            - name: DATASET_MAX_TABLES
              value: {{ . | quote }}
            {{- end }}
          volumeMounts:
            - name: clickhouse-data
              mountPath: /var/lib/clickhouse
            - name: dataset-token
              mountPath: /etc/dataset
              readOnly: true
            - name: license
              mountPath: /etc/license
              readOnly: true
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
      volumes:
        - name: clickhouse-data
          persistentVolumeClaim:
            claimName: data-kiln-clickhouse-0
        - name: dataset-token
          secret:
            secretName: {{ include "toxindex.license.datasetSecret" (dict "root" $ "name" "kiln") }}
            optional: true
        - name: license
          secret:
            secretName: {{ include "toxindex.license.secret" (dict "root" $) }}
            optional: true
{{- end }}
