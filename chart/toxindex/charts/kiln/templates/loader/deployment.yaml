{{- $dataset := .Values.global.datasets.kiln }}
{{- if and .Values.loader.enabled $dataset.version }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kiln-loader
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "kiln.labels" (dict "name" "kiln-loader" "component" "data-loader" "release" $.Release.Name) | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kiln.selectorLabels" (dict "name" "kiln-loader") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kiln.labels" (dict "name" "kiln-loader" "component" "data-loader" "release" $.Release.Name) | nindent 8 }}
    spec:
      restartPolicy: Always
      enableServiceLinks: false
      initContainers:
        - name: wait-for-clickhouse
          image: {{ include "toxindex.image" (dict "root" $ "name" "clickhouse") | quote }}
          command:
            - sh
            - -c
            - until clickhouse-client --host kiln-clickhouse --port 9000 -q 'SELECT 1'; do echo "waiting for clickhouse"; sleep 2; done
      containers:
        - name: loader
          image: {{ include "toxindex.image" (dict "root" $ "name" "kiln-loader") | quote }}
          env:
            - name: CLICKHOUSE_HOST
              value: kiln-clickhouse
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clickhouse.loaderPasswordSecret }}
                  key: password
            - name: DATASET_BUCKET
              value: {{ $dataset.bucket | quote }}
            - name: DATASET_VERSION
              value: {{ $dataset.version | quote }}
            - name: GCS_TOKEN_FILE
              value: /etc/dataset/token
            {{- with .Values.loader.maxTables }}
            - name: DATASET_MAX_TABLES
              value: {{ . | quote }}
            {{- end }}
          volumeMounts:
            - name: dataset-token
              mountPath: /etc/dataset
              readOnly: true
          readinessProbe:
            exec:
              command: ["sh", "-c", "test -f /tmp/loader-ready"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: dataset-token
          secret:
            secretName: {{ include "toxindex.license.datasetSecret" (dict "root" $ "name" "kiln") }}
            optional: true
{{- end }}
