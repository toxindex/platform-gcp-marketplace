{{- if not .Values.sparql.enabled }}
{{- fail "kiln: sparql endpoint is unavailable — enable kiln.sparql.enabled" }}
{{- end }}
{{- if not .Values.fts.enabled }}
{{- fail "kiln: fts endpoint is unavailable — enable kiln.fts.enabled" }}
{{- end }}
{{- if not .Values.query.enabled }}
{{- fail "kiln: query endpoint is unavailable — enable kiln.query.enabled" }}
{{- end }}
{{- if and .Values.sparql.enabled (not .Values.clickhouse.enabled) }}
{{- fail "kiln: kiln-sparql reads clickhouse as the plan gate's shared reader and must run beside it — enable kiln.clickhouse.enabled" }}
{{- end }}
{{- if and .Values.fts.enabled (not .Values.clickhouse.enabled) }}
{{- fail "kiln: kiln-fts builds its indexes by reading clickhouse and must run beside it — enable kiln.clickhouse.enabled" }}
{{- end }}
{{- if and .Values.query.enabled (not .Values.clickhouse.enabled) }}
{{- fail "kiln: kiln-query administers clickhouse and must run beside it — enable kiln.clickhouse.enabled" }}
{{- end }}
{{- if and .Values.loader.enabled (not .Values.clickhouse.enabled) }}
{{- fail "kiln: kiln-loader places built tables in clickhouse's own data volume and must run beside it — enable kiln.clickhouse.enabled" }}
{{- end }}
{{- if and .Values.fts.enabled (lt (int .Values.fts.readers.replicas) 2) }}
{{- fail "kiln: kiln-fts serves search from its readers, and a rollout replaces them one at a time — set kiln.fts.readers.replicas to at least 2, or every reader restart takes search down" }}
{{- end }}
