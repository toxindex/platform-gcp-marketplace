{{- if .Values.resolver.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: kiln-resolver
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "kiln.labels" (dict "name" "kiln-resolver" "component" "frontend" "release" $.Release.Name) | nindent 4 }}
spec:
  selector:
    {{- include "kiln.selectorLabels" (dict "name" "kiln-resolver") | nindent 4 }}
  ports:
    - port: 80
      targetPort: 8080
{{- end }}
