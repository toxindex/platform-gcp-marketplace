{{- if .Values.query.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: kiln-query
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "kiln.labels" (dict "name" "kiln-query" "component" "database" "release" $.Release.Name) | nindent 4 }}
spec:
  selector:
    {{- include "kiln.selectorLabels" (dict "name" "kiln-query") | nindent 4 }}
  ports:
    - port: 80
      targetPort: 8080
{{- end }}
