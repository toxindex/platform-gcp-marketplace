{{- if .Values.query.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kiln-query
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "kiln.labels" (dict "name" "kiln-query" "component" "database" "release" $.Release.Name) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "kiln.selectorLabels" (dict "name" "kiln-query") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kiln.labels" (dict "name" "kiln-query" "component" "database" "release" $.Release.Name) | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "toxindex.podSecurityContext" (dict "uid" 65532 "gid" 65532) | nindent 8 }}
      containers:
        - name: query
          image: {{ include "toxindex.image" (dict "root" $ "name" "kiln-query") | quote }}
          securityContext:
            {{- include "toxindex.containerSecurityContext" (dict) | nindent 12 }}
          env:
            {{- include "toxindex.otelEnv" (dict "root" $ "name" "kiln-query") | nindent 12 }}
            - name: CLICKHOUSE_URL
              value: {{ include "toxindex.upstream.kilnClickhouse" . | quote }}
            - name: CLICKHOUSE_GATEKEEPER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.query.credentialsSecret }}
                  key: gatekeeper-password
            - name: KILN_PLAN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.query.credentialsSecret }}
                  key: plan-key
            - name: PROXY_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.proxyAuthSecret }}
                  key: proxy-auth
            {{- include "toxindex.entitlementsEnv" (dict "root" $) | nindent 12 }}
          ports:
            - containerPort: 8080
          volumeMounts:
            {{- include "toxindex.entitlementsVolumeMount" (dict "root" $) | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        {{- include "toxindex.entitlementsVolume" (dict "root" $) | nindent 8 }}
{{- end }}
