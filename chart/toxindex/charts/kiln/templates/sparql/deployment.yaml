{{- if .Values.sparql.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kiln-sparql
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "kiln.labels" (dict "name" "kiln-sparql" "component" "backend" "release" $.Release.Name) | nindent 4 }}
spec:
  replicas: 1
  progressDeadlineSeconds: 1800
  selector:
    matchLabels:
      {{- include "kiln.selectorLabels" (dict "name" "kiln-sparql") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kiln.labels" (dict "name" "kiln-sparql" "component" "backend" "release" $.Release.Name) | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "toxindex.podSecurityContext" (dict "uid" 999 "gid" 999) | nindent 8 }}
      {{- include "toxindex.platformImagePullSecrets" $ | nindent 6 }}
      containers:
        - name: sparql
          image: {{ include "toxindex.image" (dict "root" $ "name" "kiln-sparql") | quote }}
          securityContext:
            {{- include "toxindex.containerSecurityContext" (dict) | nindent 12 }}
          env:
            {{- include "toxindex.otelEnv" (dict "root" $ "name" "kiln-sparql") | nindent 12 }}
            - name: CLICKHOUSE_URL
              value: {{ include "toxindex.upstream.kilnClickhouse" . | quote }}
            - name: ONTOP_JAVA_ARGS
              value: {{ .Values.sparql.javaOptions | quote }}
            - name: KILN_PLAN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.query.credentialsSecret }}
                  key: plan-key
            - name: PROXY_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "toxindex.proxyAuthSecretName" $ }}
                  key: proxy-auth
            {{- include "toxindex.entitlementsEnv" (dict "root" $) | nindent 12 }}
          volumeMounts:
            {{- include "toxindex.entitlementsVolumeMount" (dict "root" $) | nindent 12 }}
          ports:
            - containerPort: 8080
          startupProbe:
            httpGet:
              path: /livez
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: 8080
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.sparql.resources | nindent 12 }}
      volumes:
        {{- include "toxindex.entitlementsVolume" (dict "root" $) | nindent 8 }}
{{- end }}
