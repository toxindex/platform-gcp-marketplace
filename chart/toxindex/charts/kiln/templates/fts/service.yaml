{{- if .Values.fts.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: kiln-fts
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "kiln.labels" (dict "name" "kiln-fts" "component" "backend" "release" $.Release.Name) | nindent 4 }}
  {{- if .Values.fts.tailscale.expose }}
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: {{ .Values.fts.tailscale.hostname }}
  {{- end }}
spec:
  selector:
    {{- include "kiln.selectorLabels" (dict "name" "kiln-fts") | nindent 4 }}
  ports:
    - port: 80
      targetPort: 8080
{{- end }}
