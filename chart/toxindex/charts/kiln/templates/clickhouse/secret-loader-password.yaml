{{- if and .Values.clickhouse.enabled (not .Values.clickhouse.loaderPasswordRemoteSecret) }}
{{- $existing := lookup "v1" "Secret" (.Values.global.namespace | default .Release.Namespace) .Values.clickhouse.loaderPasswordSecret }}
{{- $password := randAlphaNum 32 }}
{{- if $existing }}
{{- $password = index $existing.data "password" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.clickhouse.loaderPasswordSecret }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "kiln.labels" (dict "name" "kiln-clickhouse" "component" "database" "release" $.Release.Name) | nindent 4 }}
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
{{- end }}
