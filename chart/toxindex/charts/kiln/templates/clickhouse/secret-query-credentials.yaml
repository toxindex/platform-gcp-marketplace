{{- if .Values.clickhouse.enabled }}
{{- $existing := lookup "v1" "Secret" (.Values.global.namespace | default .Release.Namespace) .Values.query.credentialsSecret }}
{{- $gatekeeper := randAlphaNum 32 }}
{{- $planKey := randAlphaNum 64 }}
{{- $ftsIndexer := randAlphaNum 64 }}
{{- if $existing }}
{{- $gatekeeper = index $existing.data "gatekeeper-password" | b64dec }}
{{- $planKey = index $existing.data "plan-key" | b64dec }}
{{- if hasKey $existing.data "fts-indexer-password" }}
{{- $ftsIndexer = index $existing.data "fts-indexer-password" | b64dec }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.query.credentialsSecret }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "kiln.labels" (dict "name" "kiln-query" "component" "database" "release" $.Release.Name) | nindent 4 }}
type: Opaque
data:
  gatekeeper-password: {{ $gatekeeper | b64enc | quote }}
  plan-key: {{ $planKey | b64enc | quote }}
  fts-indexer-password: {{ $ftsIndexer | b64enc | quote }}
{{- end }}
