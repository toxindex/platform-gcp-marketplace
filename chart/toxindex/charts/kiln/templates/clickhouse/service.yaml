{{- if .Values.clickhouse.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: kiln-clickhouse
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "kiln.labels" (dict "name" "kiln-clickhouse" "component" "database" "release" $.Release.Name) | nindent 4 }}
  {{- if .Values.clickhouse.tailscale.expose }}
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: {{ .Values.clickhouse.tailscale.hostname }}
  {{- end }}
spec:
  selector:
    {{- include "kiln.selectorLabels" (dict "name" "kiln-clickhouse") | nindent 4 }}
  ports:
    - name: native
      port: 9000
      targetPort: 9000
    - name: http
      port: 8123
      targetPort: 8123
{{- end }}
