networkPolicy:
  enabled: true

postgres:
  enabled: true
  host: crawler-postgres
  passwordSecret: crawler-postgres-password
  passwordRemoteSecret: ""
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      memory: 8Gi
  storage:
    class: ""
    size: 20Gi

loader:
  enabled: true
  maxBlocks: ""

resolver:
  enabled: true
  tailscale:
    expose: false
    hostname: tidx-crawler-resolver

remoteResolver:
  enabled: false
  tailnetFqdn: ""

search:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
  tailscale:
    expose: false
    hostname: tidx-crawler-search

remoteSearch:
  enabled: false
  tailnetFqdn: ""

embedder:
  enabled: true
  model: "BAAI/bge-m3"
  resources:
    requests:
      cpu: 100m
      memory: 2Gi
    limits:
      nvidia.com/gpu: 1
