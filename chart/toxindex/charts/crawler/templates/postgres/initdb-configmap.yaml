{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: crawler-postgres-initdb
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "crawler.labels" (dict "name" "crawler-postgres" "component" "database" "release" $.Release.Name) | nindent 4 }}
data:
  10-vector.sql: |
    CREATE EXTENSION IF NOT EXISTS vector;
{{- end }}
