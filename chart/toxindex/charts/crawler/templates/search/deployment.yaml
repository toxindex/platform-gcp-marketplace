{{- if .Values.search.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crawler-search
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "crawler.labels" (dict "name" "crawler-search" "component" "frontend" "release" $.Release.Name) | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 10
  selector:
    matchLabels:
      {{- include "crawler.selectorLabels" (dict "name" "crawler-search") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "crawler.labels" (dict "name" "crawler-search" "component" "frontend" "release" $.Release.Name) | nindent 8 }}
    spec:
      securityContext:
        {{- include "toxindex.podSecurityContext" (dict "uid" 65532 "gid" 65532) | nindent 8 }}
      containers:
        - name: search
          image: {{ include "toxindex.image" (dict "root" $ "name" "crawler-search") | quote }}
          securityContext:
            {{- include "toxindex.containerSecurityContext" (dict) | nindent 12 }}
          env:
            {{- include "toxindex.otelEnv" (dict "root" $ "name" "crawler-search") | nindent 12 }}
            {{- include "crawler.dbEnv" (dict "root" $ "var" "DATABASE_URL") | nindent 12 }}
            {{- if .Values.embedder.enabled }}
            - name: EMBED_URL
              value: "http://crawler-embedder:8080"
            - name: EMBED_MODEL
              value: {{ .Values.embedder.model | quote }}
            {{- end }}
          {{- with .Values.search.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 8080
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
{{- end }}
