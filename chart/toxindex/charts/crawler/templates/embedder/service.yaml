{{- if .Values.embedder.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: crawler-embedder
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "crawler.labels" (dict "name" "crawler-embedder" "component" "embedder" "release" $.Release.Name) | nindent 4 }}
spec:
  selector:
    {{- include "crawler.selectorLabels" (dict "name" "crawler-embedder") | nindent 4 }}
  ports:
    - port: 8080
      targetPort: 8080
{{- end }}
