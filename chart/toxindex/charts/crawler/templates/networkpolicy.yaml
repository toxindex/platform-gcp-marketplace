{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crawler-default-deny-ingress
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "crawler.labels" (dict "name" "crawler-default-deny-ingress" "component" "network-policy" "release" $.Release.Name) | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
{{- if .Values.postgres.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crawler-allow-postgres-ingress
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "crawler.labels" (dict "name" "crawler-postgres" "component" "network-policy" "release" $.Release.Name) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "crawler.selectorLabels" (dict "name" "crawler-postgres") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "crawler.selectorLabels" (dict "name" "crawler-search") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "crawler.selectorLabels" (dict "name" "crawler-loader") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "crawler.selectorLabels" (dict "name" "crawler-resolver") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
{{- if .Values.search.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crawler-allow-search-ingress
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "crawler.labels" (dict "name" "crawler-search" "component" "network-policy" "release" $.Release.Name) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "crawler.selectorLabels" (dict "name" "crawler-search") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
{{- end }}
{{- if .Values.embedder.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crawler-allow-embedder-ingress
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "crawler.labels" (dict "name" "crawler-embedder" "component" "network-policy" "release" $.Release.Name) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "crawler.selectorLabels" (dict "name" "crawler-embedder") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "crawler.selectorLabels" (dict "name" "crawler-search") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
{{- if .Values.resolver.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crawler-allow-resolver-ingress
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "crawler.labels" (dict "name" "crawler-resolver" "component" "network-policy" "release" $.Release.Name) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "crawler.selectorLabels" (dict "name" "crawler-resolver") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if .Values.resolver.tailscale.expose }}
    - ports:
        - protocol: TCP
          port: 8080
    {{- else }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: sage
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "crawler.selectorLabels" (dict "name" "crawler-postgres") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
{{- if .Values.loader.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crawler-allow-loader-ingress
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "crawler.labels" (dict "name" "crawler-loader" "component" "network-policy" "release" $.Release.Name) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "crawler.selectorLabels" (dict "name" "crawler-loader") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
{{- end }}
{{- end }}
