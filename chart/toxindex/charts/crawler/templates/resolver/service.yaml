{{- if .Values.resolver.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: crawler-resolver
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "crawler.labels" (dict "name" "crawler-resolver" "component" "frontend" "release" $.Release.Name) | nindent 4 }}
  {{- if .Values.resolver.tailscale.expose }}
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: {{ .Values.resolver.tailscale.hostname }}
  {{- end }}
spec:
  selector:
    {{- include "crawler.selectorLabels" (dict "name" "crawler-resolver") | nindent 4 }}
  ports:
    - port: 80
      targetPort: 8080
{{- end }}
