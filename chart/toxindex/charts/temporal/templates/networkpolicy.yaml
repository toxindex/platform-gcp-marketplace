{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: temporal-server
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "temporal.labels" (dict "name" "temporal-server" "component" "network-policy" "release" $.Release.Name) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "temporal.selectorLabels" (dict "name" "temporal-server") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- include "temporal.peerTraffic" (dict "direction" "from") | nindent 4 }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: temporal-ui
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: temporal-namespace-provisioner
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: flow
      ports:
        - protocol: TCP
          port: 7233
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: observability
      ports:
        - protocol: TCP
          port: {{ .Values.server.metricsPort }}
  egress:
    {{- include "temporal.peerTraffic" (dict "direction" "to") | nindent 4 }}
    {{- include "temporal.dnsEgress" . | nindent 4 }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: temporal
      ports:
        - protocol: TCP
          port: 5432
{{- if .Values.postgres.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: temporal-postgres
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "temporal.labels" (dict "name" "temporal-postgres" "component" "network-policy" "release" $.Release.Name) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "temporal.selectorLabels" (dict "name" "temporal-postgres") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  egress: []
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: temporal-server
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: temporal-clients
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "temporal.labels" (dict "name" "temporal-clients" "component" "network-policy" "release" $.Release.Name) | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - temporal-ui
          - temporal-namespace-provisioner
  policyTypes:
    - Egress
  egress:
    {{- include "temporal.dnsEgress" . | nindent 4 }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: temporal-server
      ports:
        - protocol: TCP
          port: 7233
{{- if and .Values.ui.enabled .Values.ui.tailscale.expose }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: temporal-ui
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "temporal.labels" (dict "name" "temporal-ui" "component" "network-policy" "release" $.Release.Name) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "temporal.selectorLabels" (dict "name" "temporal-ui") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
{{- end }}
