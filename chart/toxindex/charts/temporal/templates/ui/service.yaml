{{- if .Values.ui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "temporal.labels" (dict "name" "temporal-ui" "component" "frontend" "release" $.Release.Name) | nindent 4 }}
  {{- if .Values.ui.tailscale.expose }}
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: {{ .Values.ui.tailscale.hostname }}
  {{- end }}
spec:
  selector:
    {{- include "temporal.selectorLabels" (dict "name" "temporal-ui") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: 8080
{{- end }}
