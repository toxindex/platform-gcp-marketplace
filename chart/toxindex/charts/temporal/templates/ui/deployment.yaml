{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "temporal.labels" (dict "name" "temporal-ui" "component" "frontend" "release" $.Release.Name) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "temporal.selectorLabels" (dict "name" "temporal-ui") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "temporal.labels" (dict "name" "temporal-ui" "component" "frontend" "release" $.Release.Name) | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "toxindex.podSecurityContext" (dict "uid" 1000 "gid" 1000) | nindent 8 }}
      containers:
        - name: temporal-ui
          image: {{ include "toxindex.image" (dict "root" $ "name" "temporal-ui") | quote }}
          securityContext:
            {{- include "toxindex.containerSecurityContext" . | nindent 12 }}
          env:
            - name: TEMPORAL_ADDRESS
              value: {{ .Values.server.hostPort | quote }}
            - name: TEMPORAL_UI_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
{{- end }}
