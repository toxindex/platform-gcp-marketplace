{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: temporal-postgres
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "temporal.labels" (dict "name" "temporal-postgres" "component" "database" "release" $.Release.Name) | nindent 4 }}
spec:
  serviceName: temporal-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "temporal.selectorLabels" (dict "name" "temporal-postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "temporal.labels" (dict "name" "temporal-postgres" "component" "database" "release" $.Release.Name) | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "toxindex.podSecurityContext" (dict "uid" 999 "gid" 999) | nindent 8 }}
        fsGroup: 999
      {{- include "toxindex.platformImagePullSecrets" $ | nindent 6 }}
      containers:
        - name: postgres
          image: {{ include "toxindex.image" (dict "root" $ "name" "postgres") | quote }}
          securityContext:
            {{- include "toxindex.containerSecurityContext" . | nindent 12 }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.passwordSecret }}
                  key: password
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with .Values.postgres.storage.class }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
{{- end }}
