{{- if .Values.engine.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: git-engine
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "git.labels" (dict "name" "git-engine" "component" "backend" "release" $.Release.Name) | nindent 4 }}
spec:
  selector:
    {{- include "git.selectorLabels" (dict "name" "git-engine") | nindent 4 }}
  ports:
    - port: 80
      targetPort: 8080
{{- end }}
