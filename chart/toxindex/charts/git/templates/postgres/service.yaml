{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: git-postgres
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "git.labels" (dict "name" "git-postgres" "component" "database" "release" $.Release.Name) | nindent 4 }}
spec:
  selector:
    {{- include "git.selectorLabels" (dict "name" "git-postgres") | nindent 4 }}
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}
