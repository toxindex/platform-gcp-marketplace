{{- if .Values.oidc.remoteSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.oidc.secretName }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "gateway.labels" (dict "name" "gateway" "component" "auth-proxy" "release" $.Release.Name) | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcpsm
  target:
    name: {{ .Values.oidc.secretName }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.oidc.remoteSecret }}
{{- end }}
