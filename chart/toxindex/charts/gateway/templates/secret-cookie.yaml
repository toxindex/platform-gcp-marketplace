{{- if .Values.oidc.enabled }}
{{- $existing := lookup "v1" "Secret" (.Values.global.namespace | default .Release.Namespace) .Values.oidc.cookieSecret }}
{{- $cookie := randAlphaNum 32 }}
{{- if $existing }}
{{- $cookie = index $existing.data "cookie-secret" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.oidc.cookieSecret }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "gateway.labels" (dict "name" "gateway" "component" "auth-proxy" "release" $.Release.Name) | nindent 4 }}
type: Opaque
data:
  cookie-secret: {{ $cookie | b64enc | quote }}
{{- end }}
