{{- if .Values.oidc.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "gateway.labels" (dict "name" "gateway" "component" "auth-proxy" "release" $.Release.Name) | nindent 4 }}
spec:
  selector:
    {{- include "gateway.selectorLabels" (dict "name" "gateway") | nindent 4 }}
  ports:
    - port: 80
      targetPort: 4180
{{- end }}
