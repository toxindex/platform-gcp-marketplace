{{- if .Values.oidc.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-alpha-config
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "gateway.labels" (dict "name" "gateway" "component" "auth-proxy" "release" $.Release.Name) | nindent 4 }}
data:
  alpha.yaml: |
    server:
      bindAddress: "0.0.0.0:4180"
    upstreamConfig:
      upstreams:
      {{- range $i, $r := .Values.routes }}
        - id: route-{{ $i }}
          path: {{ $r.path }}
          uri: {{ trimSuffix "/" $r.upstream }}
          timeout: {{ printf "%ds" (int $.Values.upstreamTimeoutSec) }}
      {{- end }}
    providers:
      - id: oidc
        provider: oidc
        clientID: {{ required "gateway: oidc.clientId is required when oidc.enabled" .Values.oidc.clientId | quote }}
        clientSecretFile: /var/run/secrets/oidc/client-secret
        {{- with .Values.oidc.scope }}
        scope: {{ . | quote }}
        {{- end }}
        oidcConfig:
          issuerURL: {{ required "gateway: oidc.issuerUrl is required when oidc.enabled" .Values.oidc.issuerUrl | quote }}
          skipDiscovery: false
        {{- $custom := list }}
        {{- range (list .Values.oidc.claims.group .Values.oidc.claims.user .Values.oidc.claims.groupName .Values.oidc.claims.userName .Values.oidc.claims.email .Values.oidc.claims.groupPersonal .Values.oidc.claims.groupRole) }}
        {{- if . }}{{ $custom = append $custom . }}{{- end }}
        {{- end }}
        {{- if $custom }}
        additionalClaims:
          {{- range $custom }}
          - {{ . | quote }}
          {{- end }}
        {{- end }}
    injectRequestHeaders:
      - name: X-ToxIndex-Group
        values:
          - claimSource:
              claim: {{ required "gateway: oidc.claims.group is required when oidc.enabled" .Values.oidc.claims.group | quote }}
      - name: X-ToxIndex-User
        values:
          - claimSource:
              claim: {{ required "gateway: oidc.claims.user is required when oidc.enabled" .Values.oidc.claims.user | quote }}
      {{- range $header, $claim := dict "X-ToxIndex-Group-Name" .Values.oidc.claims.groupName "X-ToxIndex-User-Name" .Values.oidc.claims.userName "X-ToxIndex-User-Email" .Values.oidc.claims.email "X-ToxIndex-Group-Personal" .Values.oidc.claims.groupPersonal "X-ToxIndex-Group-Role" .Values.oidc.claims.groupRole }}
      - name: {{ $header }}
        {{- with $claim }}
        values:
          - claimSource:
              claim: {{ . | quote }}
        {{- else }}
        values: []
        {{- end }}
      {{- end }}
      - name: X-ToxIndex-Plan
        values: []
      - name: X-ToxIndex-Group-Admin
        values: []
      - name: X-ToxIndex-Issuer
        values:
          - secretSource:
              value: {{ required "gateway: oidc.issuerUrl is required when oidc.enabled" .Values.oidc.issuerUrl | quote }}
      - name: X-ToxIndex-Proxy-Auth
        values:
          - secretSource:
              fromEnv: PROXY_AUTH_SECRET
{{- end }}
