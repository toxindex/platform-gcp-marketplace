{{- if .Values.oidc.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "gateway.labels" (dict "name" "gateway" "component" "auth-proxy" "release" $.Release.Name) | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 10
  selector:
    matchLabels:
      {{- include "gateway.selectorLabels" (dict "name" "gateway") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/alpha-config: {{ include (print $.Template.BasePath "/configmap-alpha.yaml") . | sha256sum }}
      labels:
        {{- include "gateway.labels" (dict "name" "gateway" "component" "auth-proxy" "release" $.Release.Name) | nindent 8 }}
    spec:
      securityContext:
        {{- include "toxindex.podSecurityContext" (dict "uid" 65532 "gid" 65532) | nindent 8 }}
      containers:
        - name: gateway
          image: {{ include "toxindex.image" (dict "root" $ "name" "oauth2-proxy") | quote }}
          securityContext:
            {{- include "toxindex.containerSecurityContext" (dict) | nindent 12 }}
          args:
            - --alpha-config=/etc/oauth2-proxy/alpha.yaml
            - --cookie-secret=$(COOKIE_SECRET)
            - --email-domain={{ .Values.oidc.emailDomains }}
            - --skip-provider-button=true
            # One shared CSRF cookie lets concurrent logins clobber each other:
            # a second /oauth2/start overwrites the first flow's nonce, so its
            # callback 403s. Name the cookie per flow instead, and cap how many
            # can pile up.
            - --cookie-csrf-per-request=true
            - --cookie-csrf-per-request-limit={{ .Values.oidc.csrfPerRequestLimit }}
            - --cookie-csrf-expire={{ .Values.oidc.csrfExpire }}
            - --skip-auth-route=^/(mcp|v1|a2a|oauth|\.well-known)(/|$)
            - --skip-auth-route=^/(terms|privacy)$
            {{- with .Values.oidc.redirectUrl }}
            - --redirect-url={{ . }}
            {{- end }}
            {{- with .Values.oidc.issuerUrl }}
            - --whitelist-domain={{ (urlParse .).host }}
            {{- end }}
          env:
            - name: COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oidc.cookieSecret }}
                  key: cookie-secret
            - name: PROXY_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.proxyAuthSecret }}
                  key: proxy-auth
          volumeMounts:
            - name: alpha-config
              mountPath: /etc/oauth2-proxy
              readOnly: true
            - name: oidc-secret
              mountPath: /var/run/secrets/oidc
              readOnly: true
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 4180
          {{- include "toxindex.preStopDrain" . | nindent 10 }}
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: alpha-config
          configMap:
            name: gateway-alpha-config
        - name: oidc-secret
          secret:
            secretName: {{ .Values.oidc.secretName }}
            items:
              - key: client-secret
                path: client-secret
{{- end }}
