replicas: 2

networkPolicy:
  enabled: true

oidc:
  enabled: false
  emailDomains: "*"
  secretName: oidc
  cookieSecret: gateway-cookie
  # Per-flow CSRF cookies, so overlapping logins don't 403 each other.
  csrfPerRequestLimit: 5
  csrfExpire: 15m
  claims:
    user: email

resources:
  requests:
    cpu: 25m
    memory: 32Mi

ingress:
  enabled: false

frontendConfig:
  sslPolicy: ""

upstreamTimeoutSec: 3600

backendConfig:
  enabled: false
  connectionDrainingTimeoutSec: 60

routes:
  - path: /
    upstream: http://sage-control-plane
