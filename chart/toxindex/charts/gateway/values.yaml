networkPolicy:
  enabled: true

oidc:
  enabled: false
  issuerUrl: ""
  clientId: ""
  emailDomains: "*"
  redirectUrl: ""
  secretName: oidc
  remoteSecret: ""
  cookieSecret: gateway-cookie
  scope: ""
  claims:
    group: ""
    user: email
    groupName: ""
    userName: ""

resources:
  requests:
    cpu: 25m
    memory: 32Mi

ingress:
  enabled: false
  className: ""
  host: ""
  tlsSecret: ""
  annotations: {}

routes:
  - path: /
    upstream: http://sage-control-plane
