networkPolicy:
  enabled: true

postgres:
  enabled: true
  host: flow-postgres
  passwordSecret: flow-postgres-password
  appPasswordSecret: flow-app-password
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
  storage:
    size: 10Gi

engine:
  enabled: true
  serviceAccount:
    gcpServiceAccount:
  temporal:
    namespace: default
  artifactStore:
    bucket:
    dir: /var/lib/flow/artifacts
    storage:
      size: 20Gi
      class:
      accessMode: ReadWriteOnce
  vertex:
    project:
    region: global
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

worker:
  enabled: true
  replicas: 1
  drainSeconds: 780
  serviceAccount:
    gcpServiceAccount:
  previous:
    tag:
    digest:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 512Mi

