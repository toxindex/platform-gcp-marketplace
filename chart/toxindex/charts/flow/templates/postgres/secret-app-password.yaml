{{- if and .Values.postgres.enabled (not .Values.postgres.appPasswordRemoteSecret) }}
{{- $existing := lookup "v1" "Secret" (.Values.global.namespace | default .Release.Namespace) .Values.postgres.appPasswordSecret }}
{{- $password := randAlphaNum 32 }}
{{- if $existing }}
{{- $password = index $existing.data "password" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgres.appPasswordSecret }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "flow.labels" (dict "name" "flow-app" "component" "database" "release" $.Release.Name) | nindent 4 }}
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
{{- end }}
