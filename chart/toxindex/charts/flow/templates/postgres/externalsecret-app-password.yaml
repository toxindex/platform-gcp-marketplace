{{- if .Values.postgres.appPasswordRemoteSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.postgres.appPasswordSecret }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "flow.labels" (dict "name" "flow-app" "component" "database" "release" $.Release.Name) | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcpsm
  target:
    name: {{ .Values.postgres.appPasswordSecret }}
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.postgres.appPasswordRemoteSecret }}
{{- end }}
