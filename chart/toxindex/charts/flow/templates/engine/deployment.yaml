{{- if .Values.engine.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flow-engine
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "flow.labels" (dict "name" "flow-engine" "component" "backend" "release" $.Release.Name) | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 10
  selector:
    matchLabels:
      {{- include "flow.selectorLabels" (dict "name" "flow-engine") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "flow.labels" (dict "name" "flow-engine" "component" "backend" "release" $.Release.Name) | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 900
      serviceAccountName: flow-engine
      securityContext:
        {{- include "toxindex.podSecurityContext" (dict "uid" 65532 "gid" 65532) | nindent 8 }}
      initContainers:
        - name: wait-for-postgres
          image: {{ include "toxindex.image" (dict "root" $ "name" "flow-postgres") | quote }}
          securityContext:
            {{- include "toxindex.containerSecurityContext" (dict) | nindent 12 }}
          command:
            - sh
            - -c
            - |
              elapsed=0
              until pg_isready -h {{ .Values.postgres.host }} -p 5432 -U flow; do
                elapsed=$((elapsed + 2))
                if [ "$elapsed" -ge 120 ]; then
                  echo "timed out waiting for postgres" >&2
                  exit 1
                fi
                sleep 2
              done
        - name: migrate
          image: {{ include "toxindex.image" (dict "root" $ "name" "flow-db") | quote }}
          securityContext:
            {{- include "toxindex.containerSecurityContext" (dict) | nindent 12 }}
          env:
            {{- include "flow.migrateDbEnv" (dict "root" $) | nindent 12 }}
      containers:
        - name: flow-engine
          image: {{ include "toxindex.image" (dict "root" $ "name" "flow-engine") | quote }}
          securityContext:
            {{- include "toxindex.containerSecurityContext" (dict) | nindent 12 }}
          ports:
            - containerPort: 8080
          env:
            {{- include "toxindex.otelEnv" (dict "root" $ "name" "flow-engine") | nindent 12 }}
            {{- include "flow.dbEnv" (dict "root" $) | nindent 12 }}
            - name: CRAWLER_SEARCH_URL
              value: {{ include "toxindex.upstream.crawlerSearch" . | quote }}
            - name: TOXJOBS_URL
              value: {{ include "toxindex.upstream.toxjobs" . | quote }}
            - name: KILN_CLICKHOUSE_URL
              value: {{ include "toxindex.upstream.kilnClickhouse" . | quote }}
            - name: VERTEX_PROJECT
              value: {{ .Values.engine.vertex.project | quote }}
            - name: VERTEX_REGION
              value: {{ .Values.engine.vertex.region | quote }}
            - name: VERTEX_SERVICE_TIER
              value: {{ .Values.engine.vertex.serviceTier | quote }}
            - name: IDENTITY_MODE
              value: {{ .Values.global.identityMode | quote }}
            {{- with .Values.engine.vertex.credentialsSecret }}
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/secrets/gcp/key.json
            {{- end }}
          {{- with .Values.engine.vertex.credentialsSecret }}
          volumeMounts:
            - name: gcp-credentials
              mountPath: /var/secrets/gcp
              readOnly: true
          {{- end }}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.engine.resources | nindent 12 }}
      {{- with .Values.engine.vertex.credentialsSecret }}
      volumes:
        - name: gcp-credentials
          secret:
            secretName: {{ . }}
      {{- end }}
{{- end }}
