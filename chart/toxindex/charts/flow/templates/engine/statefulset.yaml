{{- if .Values.engine.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: flow-engine
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "flow.labels" (dict "name" "flow-engine" "component" "backend" "release" $.Release.Name) | nindent 4 }}
spec:
  replicas: 1
  serviceName: flow-engine
  updateStrategy:
    type: RollingUpdate
  minReadySeconds: 10
  selector:
    matchLabels:
      {{- include "flow.selectorLabels" (dict "name" "flow-engine") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "flow.labels" (dict "name" "flow-engine" "component" "backend" "release" $.Release.Name) | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 900
      serviceAccountName: flow-engine
      securityContext:
        {{- include "toxindex.podSecurityContext" (dict "uid" 65532 "gid" 65532) | nindent 8 }}
      {{- include "toxindex.platformImagePullSecrets" $ | nindent 6 }}
      initContainers:
        - name: wait-for-postgres
          image: {{ include "toxindex.image" (dict "root" $ "name" "postgres") | quote }}
          securityContext:
            {{- include "toxindex.containerSecurityContext" (dict) | nindent 12 }}
          command:
            - sh
            - -c
            - |
              elapsed=0
              until pg_isready -h {{ .Values.postgres.host }} -p 5432 -U flow; do
                elapsed=$((elapsed + 2))
                if [ "$elapsed" -ge 120 ]; then
                  echo "timed out waiting for postgres" >&2
                  exit 1
                fi
                sleep 2
              done
        - name: migrate
          image: {{ include "toxindex.image" (dict "root" $ "name" "flow-db") | quote }}
          securityContext:
            {{- include "toxindex.containerSecurityContext" (dict) | nindent 12 }}
          env:
            {{- include "flow.migrateDbEnv" (dict "root" $) | nindent 12 }}
      containers:
        - name: flow-engine
          image: {{ include "toxindex.image" (dict "root" $ "name" "flow-engine") | quote }}
          securityContext:
            {{- include "toxindex.containerSecurityContext" (dict) | nindent 12 }}
          ports:
            - containerPort: 8080
            - name: metering
              containerPort: 8081
          env:
            - name: METERING_PORT
              value: "8081"
            - name: TRUSTED_WORKLOADS
              value: {{ .Values.global.trustedWorkloads | toJson | quote }}
            {{- include "toxindex.otelEnv" (dict "root" $ "name" "flow-engine") | nindent 12 }}
            {{- include "toxindex.namespaceEnv" (dict "root" $) | nindent 12 }}
            {{- include "flow.dbEnv" (dict "root" $) | nindent 12 }}
            - name: GIT_ENGINE_URL
              value: {{ include "toxindex.upstream.gitEngine" . | quote }}
            - name: TEMPORAL_HOST_PORT
              value: {{ include "toxindex.upstream.temporal" . | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ .Values.engine.temporal.namespace | quote }}
            - name: PROXY_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "toxindex.proxyAuthSecretName" $ }}
                  key: proxy-auth
            {{- with .Values.engine.vertex.credentialsSecret }}
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/secrets/gcp/key.json
            {{- end }}
            {{- include "toxindex.entitlementsEnv" (dict "root" $) | nindent 12 }}
            {{- include "toxindex.blobStoreEnv" .Values.engine.artifactStore | nindent 12 }}
          volumeMounts:
            {{- include "toxindex.entitlementsVolumeMount" (dict "root" $) | nindent 12 }}
            {{- if not .Values.engine.artifactStore.bucket }}
            - name: artifacts
              mountPath: {{ .Values.engine.artifactStore.dir }}
              readOnly: true
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.engine.resources | nindent 12 }}
      volumes:
        {{- include "toxindex.entitlementsVolume" (dict "root" $) | nindent 8 }}
        {{- if not .Values.engine.artifactStore.bucket }}
        - name: artifacts
          persistentVolumeClaim:
            claimName: flow-artifacts
            readOnly: true
        {{- end }}
{{- end }}
