{{- if .Values.engine.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: flow-engine
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "flow.labels" (dict "name" "flow-engine" "component" "backend" "release" $.Release.Name) | nindent 4 }}
  {{- if .Values.engine.tailscale.expose }}
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: {{ .Values.engine.tailscale.hostname }}
  {{- end }}
spec:
  selector:
    {{- include "flow.selectorLabels" (dict "name" "flow-engine") | nindent 4 }}
  ports:
    - port: 80
      targetPort: 8080
{{- end }}
