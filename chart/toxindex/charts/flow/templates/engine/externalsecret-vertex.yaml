{{- if and .Values.engine.enabled .Values.engine.vertex.credentialsRemoteSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.engine.vertex.credentialsSecret }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "flow.labels" (dict "name" "flow-engine" "component" "backend" "release" $.Release.Name) | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcpsm
  target:
    name: {{ .Values.engine.vertex.credentialsSecret }}
    creationPolicy: Owner
  data:
    - secretKey: key.json
      remoteRef:
        key: {{ .Values.engine.vertex.credentialsRemoteSecret }}
{{- end }}
