{{- if .Values.engine.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flow-engine
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "flow.labels" (dict "name" "flow-engine" "component" "backend" "release" $.Release.Name) | nindent 4 }}
  {{- with .Values.engine.serviceAccount.gcpServiceAccount }}
  annotations:
    iam.gke.io/gcp-service-account: {{ . }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
