networkPolicy:
  enabled: true

remote:
  enabled: false

postgres:
  enabled: true
  host: sage-postgres
  passwordSecret: sage-postgres-password
  passwordRemoteSecret: ""
  appPasswordSecret: sage-app-password
  appPasswordRemoteSecret: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
  storage:
    class: ""
    size: 10Gi

agent:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
  serviceAccount:
    gcpServiceAccount: ""
  vertex:
    project:
    region: global
    serviceTier: standard

fileStore:
  bucket: ""
  serviceAccount:
    gcpServiceAccount: ""

controlPlane:
  enabled: true
  agentUrl: http://sage-agent:8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
