networkPolicy:
  enabled: true

postgres:
  enabled: true
  host: sage-postgres
  passwordSecret: sage-postgres-password
  appPasswordSecret: sage-app-password
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
  storage:
    size: 10Gi

agent:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
  serviceAccount:
    gcpServiceAccount:
  vertex:
    project:
    region: global

fileStore:
  serviceAccount:
    gcpServiceAccount:
  storage:
    size: 20Gi

controlPlane:
  enabled: true
  agentUrl: http://sage-agent:8080
  issueReportsUrl: ""
  entities: true
  adminFrom: []
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
