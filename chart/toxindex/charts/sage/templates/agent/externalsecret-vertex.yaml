{{- if and .Values.agent.enabled .Values.agent.vertex.credentialsRemoteSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    helm.sh/resource-policy: keep
  name: {{ required "sage: agent.vertex.credentialsSecret names the Secret agent.vertex.credentialsRemoteSecret is synced into" .Values.agent.vertex.credentialsSecret }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "sage.labels" (dict "name" "sage-agent" "component" "backend" "release" $.Release.Name) | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcpsm
  target:
    name: {{ .Values.agent.vertex.credentialsSecret }}
    creationPolicy: Owner
  data:
    - secretKey: key.json
      remoteRef:
        key: {{ .Values.agent.vertex.credentialsRemoteSecret }}
{{- end }}
