{{- if .Values.agent.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sage-agent
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "sage.labels" (dict "name" "sage-agent" "component" "agent" "release" $.Release.Name) | nindent 4 }}
spec:
  replicas: 1
  strategy:
    {{- include "sage.rolloutStrategy" . | nindent 4 }}
  minReadySeconds: 10
  selector:
    matchLabels:
      {{- include "sage.selectorLabels" (dict "name" "sage-agent") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sage.labels" (dict "name" "sage-agent" "component" "agent" "release" $.Release.Name) | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 900
      serviceAccountName: sage-agent
      securityContext:
        {{- include "toxindex.podSecurityContext" (dict "uid" 65532 "gid" 65532) | nindent 8 }}
        {{- if include "sage.blobsOnDisk" . }}
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        {{- end }}
      {{- if and (include "sage.blobsOnDisk" .) .Values.controlPlane.enabled }}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "sage.selectorLabels" (dict "name" "sage-control-plane") | nindent 18 }}
              topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- include "toxindex.platformImagePullSecrets" $ | nindent 6 }}
      containers:
        - name: sage-agent
          image: {{ include "toxindex.image" (dict "root" $ "name" "sage-agent") | quote }}
          securityContext:
            {{- include "toxindex.containerSecurityContext" (dict) | nindent 12 }}
          env:
            {{- include "toxindex.otelEnv" (dict "root" $ "name" "sage-agent") | nindent 12 }}
            {{- include "toxindex.namespaceEnv" (dict "root" $) | nindent 12 }}
            {{- include "sage.dbEnv" (dict "root" $) | nindent 12 }}
            {{- include "toxindex.blobStoreEnv" (dict "bucket" .Values.fileStore.bucket "signerServiceAccount" .Values.fileStore.serviceAccount.gcpServiceAccount "dir" (include "sage.blobDir" .)) | nindent 12 }}
            - name: VERTEX_PROJECT
              value: {{ .Values.agent.vertex.project | default "" | quote }}
            - name: VERTEX_REGION
              value: {{ required "sage.agent.vertex.region is required: it is the Vertex AI location every model call goes to" .Values.agent.vertex.region | quote }}
            - name: FLOW_ENGINE_URL
              value: {{ include "toxindex.upstream.flowEngine" . | quote }}
            - name: GIT_ENGINE_URL
              value: {{ include "toxindex.upstream.gitEngine" . | quote }}
            {{- if .Values.global.sysrev.enabled }}
            - name: SYSREV_API_URL
              value: {{ include "toxindex.upstream.sysrevApi" . | quote }}
            {{- end }}
            - name: KILN_CLICKHOUSE_URL
              value: {{ include "toxindex.upstream.kilnQuery" . | quote }}
            - name: KILN_FTS_URL
              value: {{ include "toxindex.upstream.kilnFts" . | quote }}
            - name: TOXJOBS_URL
              value: {{ include "toxindex.upstream.toxjobs" . | quote }}
            - name: PROXY_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "toxindex.proxyAuthSecretName" $ }}
                  key: proxy-auth
            {{- include "toxindex.entitlementsEnv" (dict "root" $) | nindent 12 }}
            {{- with .Values.agent.vertex.credentialsSecret }}
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/secrets/gcp/key.json
            {{- end }}
          volumeMounts:
            {{- include "toxindex.entitlementsVolumeMount" (dict "root" $) | nindent 12 }}
            {{- if include "sage.blobsOnDisk" . }}
            - name: blobs
              mountPath: {{ include "sage.blobDir" . }}
            {{- end }}
            {{- with .Values.agent.vertex.credentialsSecret }}
            - name: gcp-credentials
              mountPath: /var/secrets/gcp
              readOnly: true
            {{- end }}
          {{- with .Values.agent.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        {{- include "toxindex.entitlementsVolume" (dict "root" $) | nindent 8 }}
        {{- if include "sage.blobsOnDisk" . }}
        - name: blobs
          persistentVolumeClaim:
            claimName: sage-blobs
        {{- end }}
        {{- with .Values.agent.vertex.credentialsSecret }}
        - name: gcp-credentials
          secret:
            secretName: {{ . }}
        {{- end }}
{{- end }}
