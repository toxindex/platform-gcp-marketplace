{{- if .Values.agent.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sage-agent
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "sage.labels" (dict "name" "sage-agent" "component" "agent" "release" $.Release.Name) | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 10
  selector:
    matchLabels:
      {{- include "sage.selectorLabels" (dict "name" "sage-agent") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sage.labels" (dict "name" "sage-agent" "component" "agent" "release" $.Release.Name) | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 900
      serviceAccountName: sage-agent
      securityContext:
        {{- include "toxindex.podSecurityContext" (dict "uid" 65532 "gid" 65532) | nindent 8 }}
      containers:
        - name: sage-agent
          image: {{ include "toxindex.image" (dict "root" $ "name" "sage-agent") | quote }}
          securityContext:
            {{- include "toxindex.containerSecurityContext" (dict) | nindent 12 }}
          env:
            {{- include "toxindex.otelEnv" (dict "root" $ "name" "sage-agent") | nindent 12 }}
            {{- include "sage.dbEnv" (dict "root" $) | nindent 12 }}
            - name: VERTEX_PROJECT
              value: {{ .Values.agent.vertex.project | quote }}
            - name: VERTEX_REGION
              value: {{ .Values.agent.vertex.region | quote }}
            - name: VERTEX_SERVICE_TIER
              value: {{ .Values.agent.vertex.serviceTier | quote }}
            - name: FLOW_ENGINE_URL
              value: {{ include "toxindex.upstream.flowEngine" . | quote }}
            - name: CRAWLER_SEARCH_URL
              value: {{ include "toxindex.upstream.crawlerSearch" . | quote }}
            - name: KILN_CLICKHOUSE_URL
              value: {{ include "toxindex.upstream.kilnClickhouse" . | quote }}
            - name: TOXJOBS_URL
              value: {{ include "toxindex.upstream.toxjobs" . | quote }}
            - name: IDENTITY_MODE
              value: {{ .Values.global.identityMode | quote }}
          {{- with .Values.agent.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 8080
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
{{- end }}
