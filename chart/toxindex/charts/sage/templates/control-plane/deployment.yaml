{{- if .Values.controlPlane.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sage-control-plane
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "sage.labels" (dict "name" "sage-control-plane" "component" "frontend" "release" $.Release.Name) | nindent 4 }}
spec:
  replicas: 1
  strategy:
    {{- include "sage.rolloutStrategy" . | nindent 4 }}
  minReadySeconds: 10
  selector:
    matchLabels:
      {{- include "sage.selectorLabels" (dict "name" "sage-control-plane") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sage.labels" (dict "name" "sage-control-plane" "component" "frontend" "release" $.Release.Name) | nindent 8 }}
    spec:
      serviceAccountName: sage-control-plane
      terminationGracePeriodSeconds: 45
      securityContext:
        {{- include "toxindex.podSecurityContext" (dict "uid" 65532 "gid" 65532) | nindent 8 }}
        {{- if include "sage.blobsOnDisk" . }}
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        {{- end }}
      {{- if and (include "sage.blobsOnDisk" .) .Values.agent.enabled }}
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "sage.selectorLabels" (dict "name" "sage-agent") | nindent 20 }}
                topologyKey: kubernetes.io/hostname
      {{- end }}
      initContainers:
        - name: wait-for-postgres
          image: {{ include "toxindex.image" (dict "root" $ "name" "postgres") | quote }}
          securityContext:
            {{- include "toxindex.containerSecurityContext" (dict) | nindent 12 }}
          command:
            - sh
            - -c
            - |
              elapsed=0
              until pg_isready -h {{ .Values.postgres.host }} -p 5432 -U sage; do
                elapsed=$((elapsed + 2))
                if [ "$elapsed" -ge 120 ]; then
                  echo "timed out waiting for postgres" >&2
                  exit 1
                fi
                sleep 2
              done
        - name: migrate
          image: {{ include "toxindex.image" (dict "root" $ "name" "sage-db") | quote }}
          securityContext:
            {{- include "toxindex.containerSecurityContext" (dict) | nindent 12 }}
          env:
            {{- include "sage.migrateDbEnv" (dict "root" $) | nindent 12 }}
      containers:
        - name: sage-control-plane
          image: {{ include "toxindex.image" (dict "root" $ "name" "sage-control-plane") | quote }}
          securityContext:
            {{- include "toxindex.containerSecurityContext" (dict) | nindent 12 }}
          env:
            {{- include "toxindex.otelEnv" (dict "root" $ "name" "sage-control-plane") | nindent 12 }}
            {{- include "toxindex.sentryEnv" (dict "root" $) | nindent 12 }}
            {{- include "toxindex.operatorEnv" (dict "root" $) | nindent 12 }}
            - name: SAGE_AGENT_URL
              value: {{ .Values.controlPlane.agentUrl | quote }}
            - name: KILN_CLICKHOUSE_URL
              value: {{ include "toxindex.upstream.kilnQuery" . | quote }}
            - name: KILN_RESOLVER_URL
              value: {{ include "toxindex.upstream.kilnResolver" . | quote }}
            - name: KILN_SPARQL_URL
              value: {{ include "toxindex.upstream.kilnSparql" . | quote }}
            - name: KILN_FTS_URL
              value: {{ include "toxindex.upstream.kilnFts" . | quote }}
            - name: FLOW_ENGINE_URL
              value: {{ include "toxindex.upstream.flowEngine" . | quote }}
            - name: GIT_ENGINE_URL
              value: {{ include "toxindex.upstream.gitEngine" . | quote }}
            {{- if .Values.global.sysrev.enabled }}
            - name: SYSREV_API_URL
              value: {{ include "toxindex.upstream.sysrevApi" . | quote }}
            {{- end }}
            - name: TOXJOBS_URL
              value: {{ include "toxindex.upstream.toxjobs" . | quote }}
            - name: AUTH
              value: {{ .Values.global.auth | quote }}
            - name: BLOB_STORAGE_ORIGIN
              value: {{ .Values.global.storage.host | quote }}
            - name: PROXY_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.proxyAuthSecret }}
                  key: proxy-auth
            {{- include "sage.dbEnv" (dict "root" $) | nindent 12 }}
            {{- include "toxindex.blobStoreEnv" (dict "bucket" .Values.fileStore.bucket "signerServiceAccount" .Values.fileStore.serviceAccount.gcpServiceAccount "dir" (include "sage.blobDir" .)) | nindent 12 }}
          {{- if include "sage.blobsOnDisk" . }}
          volumeMounts:
            - name: blobs
              mountPath: {{ include "sage.blobDir" . }}
          {{- end }}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ .Values.controlPlane.resources.requests.cpu | quote }}
              memory: {{ .Values.controlPlane.resources.requests.memory | quote }}
            limits:
              memory: {{ .Values.controlPlane.resources.limits.memory | quote }}
      {{- if include "sage.blobsOnDisk" . }}
      volumes:
        - name: blobs
          persistentVolumeClaim:
            claimName: sage-blobs
      {{- end }}
{{- end }}
