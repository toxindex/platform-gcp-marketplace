{{- if .Values.networkPolicy.enabled }}
{{- if .Values.postgres.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sage-allow-postgres-ingress
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "sage.labels" (dict "name" "sage-postgres" "component" "network-policy" "release" $.Release.Name) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sage.selectorLabels" (dict "name" "sage-postgres") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: sage
      ports:
        - protocol: TCP
          port: 5432
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
{{- if .Values.agent.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sage-allow-agent-ingress
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "sage.labels" (dict "name" "sage-agent" "component" "network-policy" "release" $.Release.Name) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sage.selectorLabels" (dict "name" "sage-agent") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "sage.selectorLabels" (dict "name" "sage-control-plane") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: sage
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: flow
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: git
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: kiln
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: toxjobs
      ports:
        - protocol: TCP
          port: 8080
    {{- if .Values.global.sysrev.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: sysrev
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: observability
      ports:
        - protocol: TCP
          port: 4317
    - ports:
        - protocol: TCP
          port: 443
    {{- include "toxindex.gcpMetadataEgress" . | nindent 4 }}
{{- end }}
{{- if .Values.controlPlane.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sage-allow-control-plane-ingress
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "sage.labels" (dict "name" "sage-control-plane" "component" "network-policy" "release" $.Release.Name) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sage.selectorLabels" (dict "name" "sage-control-plane") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if eq .Values.global.auth "gateway" }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: gateway
      ports:
        - protocol: TCP
          port: 8080
    {{- else }}
    - ports:
        - protocol: TCP
          port: 8080
    {{- end }}
    {{- with .Values.controlPlane.adminFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: 8081
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.agent.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "sage.selectorLabels" (dict "name" "sage-agent") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: sage
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: kiln
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: flow
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: git
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: toxjobs
      ports:
        - protocol: TCP
          port: 8080
    {{- if .Values.global.sysrev.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: sysrev
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
    {{- end }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: observability
      ports:
        - protocol: TCP
          port: 4317
    {{- if or .Values.fileStore.bucket .Values.controlPlane.issueReportsUrl .Values.global.trustedWorkloads }}
    - ports:
        - protocol: TCP
          port: 443
    {{- include "toxindex.gcpMetadataEgress" . | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
