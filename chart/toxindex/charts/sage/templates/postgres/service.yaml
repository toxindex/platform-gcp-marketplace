{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: sage-postgres
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "sage.labels" (dict "name" "sage-postgres" "component" "database" "release" $.Release.Name) | nindent 4 }}
spec:
  selector:
    {{- include "sage.selectorLabels" (dict "name" "sage-postgres") | nindent 4 }}
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}
