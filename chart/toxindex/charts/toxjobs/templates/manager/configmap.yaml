{{- if .Values.manager.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: toxjobs-manager
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "toxjobs.labels" (dict "name" "toxjobs-manager" "component" "manager" "release" $.Release.Name) | nindent 4 }}
data:
  rigs.json: |
    {{- $rigs := list }}
    {{- range $name, $img := .Values.global.images }}
    {{- if hasPrefix "toxjobs-" $name }}
    {{- if ne $name "toxjobs-manager" }}
    {{- $gpu := has $name $.Values.manager.gpuRigs }}
    {{- $rigOverride := dig $name "resources" nil $.Values.manager.rigOverrides }}
    {{- $resources := dict }}
    {{- if $gpu }}
    {{- $resources = $.Values.manager.gpu.resources }}
    {{- else if $rigOverride }}
    {{- $resources = $rigOverride }}
    {{- else }}
    {{- $resources = $.Values.manager.resources }}
    {{- end }}
    {{- $startupProbe := ternary $.Values.manager.gpu.startupProbe $.Values.manager.startupProbe $gpu }}
    {{- $rig := dict "name" $name "image" (include "toxindex.toolImage" (dict "root" $ "name" $name)) "gpu" $gpu "resources" $resources "startupProbe" $startupProbe }}
    {{- $rigs = append $rigs $rig }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- toJson $rigs | nindent 4 }}
{{- end }}
