{{- if .Values.manager.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: toxjobs-manager
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "toxjobs.labels" (dict "name" "toxjobs-manager" "component" "manager" "release" $.Release.Name) | nindent 4 }}
data:
  rigs.json: |
    {{- $rigs := list }}
    {{- $rigTools := .Files.Get "rig-tools.json" | fromJson }}
    {{- range $name, $img := .Values.global.images }}
    {{- if hasPrefix "toxjobs-" $name }}
    {{- if ne $name "toxjobs-manager" }}
    {{- if not (has $name $.Values.manager.excludeRigs) }}
    {{- $gpu := has $name $.Values.manager.gpuRigs }}
    {{- $rigOverride := dig $name "resources" nil $.Values.manager.rigOverrides }}
    {{- /* Merge the override onto the class default; replacing would drop nvidia.com/gpu. */}}
    {{- $resources := ternary $.Values.manager.gpu.resources $.Values.manager.resources $gpu }}
    {{- if $rigOverride }}
    {{- $resources = mergeOverwrite (deepCopy $resources) $rigOverride }}
    {{- end }}
    {{- $startupProbe := ternary $.Values.manager.gpu.startupProbe $.Values.manager.startupProbe $gpu }}
    {{- $rigEnv := dig $name "env" dict $.Values.manager.rigOverrides }}
    {{- $tools := dig $name (list) $rigTools }}
    {{- $rig := dict "name" $name "image" (include "toxindex.toolImage" (dict "root" $ "name" $name)) "gpu" $gpu "tools" $tools "resources" $resources "startupProbe" $startupProbe "env" $rigEnv }}
    {{- $rigs = append $rigs $rig }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- toJson $rigs | nindent 4 }}
  gpu.json: |
    {{- .Values.global.gpu | default dict | toJson | nindent 4 }}
{{- end }}
