{{- if .Values.manager.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: toxjobs-manager
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  annotations:
    ignore-check.kube-linter.io/env-var-secret: RIG_PULL_SECRET and GRANTS_SECRET carry Secret names, not secret values
  labels:
    {{- include "toxjobs.labels" (dict "name" "toxjobs-manager" "component" "manager" "release" $.Release.Name) | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 10
  selector:
    matchLabels:
      {{- include "toxjobs.selectorLabels" (dict "name" "toxjobs-manager") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "toxjobs.labels" (dict "name" "toxjobs-manager" "component" "manager" "release" $.Release.Name) | nindent 8 }}
      annotations:
        checksum/rigs: {{ include (print $.Template.BasePath "/manager/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: toxjobs-manager
      securityContext:
        {{- include "toxindex.podSecurityContext" (dict "uid" 65532 "gid" 65532) | nindent 8 }}
      {{- include "toxindex.platformImagePullSecrets" $ | nindent 6 }}
      containers:
        - name: manager
          image: {{ include "toxindex.image" (dict "root" $ "name" "toxjobs-manager") | quote }}
          securityContext:
            {{- include "toxindex.containerSecurityContext" (dict) | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: {{ .Values.manager.metricsPort }}
          env:
            {{- include "toxindex.otelEnv" (dict "root" $ "name" "toxjobs-manager") | nindent 12 }}
            {{- include "toxindex.namespaceEnv" (dict "root" $) | nindent 12 }}
            - name: METRICS_PORT
              value: {{ .Values.manager.metricsPort | quote }}
            - name: RIG_CONFIG_PATH
              value: /etc/toxjobs/rigs.json
            - name: GPU_CONFIG_PATH
              value: /etc/toxjobs/gpu.json
            - name: RIG_PORT
              value: {{ .Values.manager.rigPort | quote }}
            - name: RIG_SERVICE_ACCOUNT
              value: rig-server
            - name: RIG_PULL_SECRET
              value: {{ .Values.global.license.registrySecret | quote }}
            - name: RIG_GRANTS
              value: {{ join "," (.Values.manager.rigGrants | required "manager.rigGrants must name the rigs and tools this install may run") | quote }}
            - name: GRANTS_SECRET
              value: {{ .Values.global.license.grantsSecret | quote }}
            - name: GRANTS_PUBLIC_KEY
              value: {{ .Values.global.license.grantsPublicKey | required "global.license.grantsPublicKey must be pinned to verify grant manifests offline" | quote }}
            - name: RECONCILE_INTERVAL
              value: {{ .Values.manager.reconcileInterval | quote }}
            - name: PROXY_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "toxindex.proxyAuthSecretName" $ }}
                  key: proxy-auth
            {{- include "toxindex.entitlementsEnv" (dict "root" $) | nindent 12 }}
            - name: RIG_ENV_OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ include "toxindex.otelEndpoint" (dict "root" $) | quote }}
            - name: RIG_ENV_OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=toxindex
            {{- range $k, $v := .Values.manager.rigEnv }}
            - name: {{ printf "RIG_ENV_%s" $k }}
              value: {{ $v | quote }}
            {{- end }}
          volumeMounts:
            - name: rig-config
              mountPath: /etc/toxjobs
              readOnly: true
            {{- include "toxindex.entitlementsVolumeMount" (dict "root" $) | nindent 12 }}
          resources:
            {{- toYaml .Values.manager.managerResources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
      volumes:
        - name: rig-config
          configMap:
            name: toxjobs-manager
        {{- include "toxindex.entitlementsVolume" (dict "root" $) | nindent 8 }}
{{- end }}
