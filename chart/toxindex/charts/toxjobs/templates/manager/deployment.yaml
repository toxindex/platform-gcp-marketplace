{{- if .Values.manager.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: toxjobs-manager
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "toxjobs.labels" (dict "name" "toxjobs-manager" "component" "manager" "release" $.Release.Name) | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 10
  selector:
    matchLabels:
      {{- include "toxjobs.selectorLabels" (dict "name" "toxjobs-manager") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "toxjobs.labels" (dict "name" "toxjobs-manager" "component" "manager" "release" $.Release.Name) | nindent 8 }}
      annotations:
        checksum/rigs: {{ include (print $.Template.BasePath "/manager/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: toxjobs-manager
      securityContext:
        {{- include "toxindex.podSecurityContext" (dict "uid" 65532 "gid" 65532) | nindent 8 }}
      containers:
        - name: manager
          image: {{ include "toxindex.image" (dict "root" $ "name" "toxjobs-manager") | quote }}
          securityContext:
            {{- include "toxindex.containerSecurityContext" (dict) | nindent 12 }}
          ports:
            - containerPort: 8080
          env:
            {{- include "toxindex.otelEnv" (dict "root" $ "name" "toxjobs-manager") | nindent 12 }}
            - name: NAMESPACE
              value: {{ (.Values.global.namespace | default .Release.Namespace) | quote }}
            - name: RIG_CONFIG_PATH
              value: /etc/toxjobs/rigs.json
            - name: RIG_PORT
              value: {{ .Values.manager.rigPort | quote }}
            - name: RIG_SERVICE_ACCOUNT
              value: rig-server
            - name: RIG_PULL_SECRET
              value: {{ .Values.global.license.registrySecret | quote }}
            {{- with .Values.manager.rigAllowlist }}
            - name: RIG_ALLOWLIST
              value: {{ join "," . | quote }}
            {{- end }}
            - name: RECONCILE_INTERVAL
              value: {{ .Values.manager.reconcileInterval | quote }}
            - name: RIG_ENV_OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ include "toxindex.otelEndpoint" (dict "root" $) | quote }}
            - name: RIG_ENV_OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=toxindex
            {{- range $k, $v := .Values.manager.rigEnv }}
            - name: {{ printf "RIG_ENV_%s" $k }}
              value: {{ $v | quote }}
            {{- end }}
          volumeMounts:
            - name: rig-config
              mountPath: /etc/toxjobs
              readOnly: true
          resources:
            {{- toYaml .Values.manager.managerResources | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
      volumes:
        - name: rig-config
          configMap:
            name: toxjobs-manager
{{- end }}
